<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- iOS PWA / camera permissions -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Urban Intelligence Node — SIH26124</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Fix: center tap-prompt inside viewport */
    #tapToStartPrompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      padding: 16px 20px;
      background: rgba(15,23,42,0.90);
      border-radius: 10px;
      border: 1px solid rgba(56,189,248,0.5);
      backdrop-filter: blur(6px);
      z-index: 20;
      white-space: nowrap;
    }
    /* Fix: ensure canvas is truly hidden but still capturable */
    #captureCanvas {
      display: none !important;
      position: absolute;
      top: 0; left: 0;
      z-index: -1;
    }
    /* HTTPS banner */
    #httpsBanner {
      display: none;
      background: linear-gradient(90deg, #0369a1, #0284c7);
      color: white;
      padding: 10px 14px;
      font-size: 12px;
      border-bottom: 2px solid #38bdf8;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #httpsBanner.visible { display: flex !important; }
    /* connection status overlay */
    #connStatus {
      position: fixed;
      top: 52px; right: 10px;
      background: rgba(15,23,42,0.92);
      border: 1px solid rgba(56,189,248,0.4);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 10px;
      font-family: monospace;
      color: #94a3b8;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:0;">
      <span class="status-dot" id="statusDot"></span>
      <h1 style="display:inline">FLEET SENSOR NODE</h1>
    </div>
    <div class="device-badge" id="deviceBadge">LOADING...</div>
  </header>

  <!-- HTTPS upgrade banner (shown only on HTTP) -->
  <div id="httpsBanner">
    <span>🔒 Camera needs HTTPS. Switch for live streaming.</span>
    <a id="httpsSwitchBtn" href="#" style="background:#38bdf8;color:#0f172a;font-weight:700;padding:5px 10px;border-radius:4px;text-decoration:none;font-size:11px;margin-left:8px;white-space:nowrap;">↑ SWITCH TO HTTPS</a>
  </div>

  <div id="connStatus">⬤ CONNECTING...</div>

  <div class="viewport" id="viewportArea">
    <video id="videoElement" autoplay playsinline muted webkit-playsinline></video>
    <canvas id="captureCanvas" width="640" height="480"></canvas>

    <div class="overlay-hud">
      <div class="hud-pill" id="fpsHud">FPS: 0.0</div>
      <div class="hud-pill" id="netHud">BW: 0 KB/s</div>
    </div>

    <div id="tapToStartPrompt">
      <div style="font-size:28px;margin-bottom:6px;">📷</div>
      <div style="font-size:15px;font-weight:700;color:#38bdf8;">TAP BUTTON BELOW</div>
      <div style="font-size:11px;color:#94a3b8;margin-top:4px;">To Start Live Dashcam Stream</div>
    </div>
  </div>

  <div style="background:#0f172a;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #1e293b;font-size:11px;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="color:#94a3b8;font-weight:600;">GPS:</span>
      <span id="gpsStatusPill" style="font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:rgba(56,189,248,0.2);color:#38bdf8;">BHUBANESWAR</span>
    </div>
    <div style="display:flex;gap:4px;">
      <button id="btnGpsSim" style="background:#0284c7;color:white;border:none;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;">🚌 JANPATH LOOP</button>
      <button id="btnGpsReal" style="background:#1e293b;color:#94a3b8;border:none;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;">📍 HARDWARE GPS</button>
    </div>
  </div>

  <div class="telemetry-grid">
    <div class="telemetry-item">
      LAT / LON
      <span id="coordsDisplay">20.18000, 85.73800</span>
    </div>
    <div class="telemetry-item">
      SPEED / ACCURACY
      <span id="speedDisplay">0.0 km/h | ±3m</span>
    </div>
    <div class="telemetry-item">
      PACKETS SENT
      <span id="packetDisplay">0 sent</span>
    </div>
  </div>

  <div class="controls-bar">
    <button class="btn btn-primary" id="btnToggleStream">▶ START SENSING</button>
    <div class="btn btn-secondary" id="aiModeIndicator" style="display:flex;align-items:center;justify-content:center;font-size:11px;cursor:default;background:#064e3b;color:#34d399;font-weight:600;letter-spacing:0.5px;border:1px solid #059669;">● LIVE AI ON</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
